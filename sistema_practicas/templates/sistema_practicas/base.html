<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de prácticas{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --card: #ffffff;
            --text: #1f2933;
            --muted: #52606d;
            --border: #d9e2ec;
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
            --ok: #047857;
            --warn: #b45309;
            --err: #b91c1c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header, main { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
        header {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        h1 { margin: 0 0 0.35rem; font-size: 1.6rem; }
        p.lead { margin: 0; color: var(--muted); }
        .panel, .oferta, .mensaje, .vacio {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.15rem;
            margin-top: 1rem;
        }
        label { display: block; font-size: 0.9rem; margin-bottom: 0.3rem; }
        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            max-width: 360px;
            padding: 0.5rem 0.55rem;
            margin-bottom: 0.85rem;
        }
        button, .boton-secundario {
            background: var(--accent);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 0.5rem 0.9rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover { background: var(--accent-hover); }
        .boton-secundario {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .oferta h2 { margin: 0 0 0.4rem; font-size: 1.15rem; }
        .meta { color: var(--muted); font-size: 0.92rem; margin: 0.15rem 0; }
        .mensaje.success { border-left: 4px solid var(--ok); }
        .mensaje.warning { border-left: 4px solid var(--warn); }
        .mensaje.error { border-left: 4px solid var(--err); }
        .estado {
            display: inline-block;
            margin-top: 0.75rem;
            color: var(--ok);
            font-weight: bold;
        }
        .login-box { max-width: 420px; }
    </style>
</head>
<body>
    {% block body %}{% endblock %}
</body>
</html>
