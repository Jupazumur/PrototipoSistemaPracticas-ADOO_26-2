{% load static %}
<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de prácticas{% endblock %}</title>
    
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    
    <!-- DaisyUI y Tailwind CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración de colores de Tailwind basados en la imagen -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        institucional: {
                            blue: '#00479b',
                            orange: '#f89d1c',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="min-h-screen flex flex-col items-center">
    <!-- Navbar superior con color institucional -->
    <div class="w-full bg-institucional-blue text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="font-bold text-xl tracking-wide">Universidad de Sonora</div>
        </div>
    </div>

    <div class="w-full max-w-6xl mx-auto p-4 md:p-6 lg:p-8">
        {% block body %}{% endblock %}
    </div>
</body>
</html>
