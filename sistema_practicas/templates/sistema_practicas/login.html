{% extends "sistema_practicas/base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block body %}
<div class="flex flex-col items-center justify-center min-h-[70vh]">
    <header class="text-center mb-8">
        <h1 class="text-3xl font-bold text-institucional-blue mb-2">Sistema de prácticas</h1>
        <p class="text-gray-600">Inicia sesión para continuar.</p>
    </header>

    <main class="w-full max-w-md">
        {% if messages %}
            <div class="space-y-2 mb-6">
            {% for message in messages %}
                <div role="alert" class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% else %}alert-warning{% endif %} shadow-sm">
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
            </div>
        {% endif %}

        <section class="card bg-base-100 shadow-xl border border-base-200">
            <div class="card-body">
                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <div class="form-control w-full">
                        <label for="correo" class="label">
                            <span class="label-text font-medium">Correo</span>
                        </label>
                        <input id="correo" name="correo" type="email" required autocomplete="username" class="input input-bordered w-full focus:border-institucional-blue focus:ring-institucional-blue" placeholder="correo@ejemplo.com">
                    </div>

                    <div class="form-control w-full">
                        <label for="password" class="label">
                            <span class="label-text font-medium">Contraseña</span>
                        </label>
                        <input id="password" name="password" type="password" required autocomplete="current-password" class="input input-bordered w-full focus:border-institucional-blue focus:ring-institucional-blue" placeholder="••••••••">
                    </div>

                    <div class="form-control mt-6">
                        <button type="submit" class="btn bg-institucional-orange hover:bg-orange-500 text-white border-none w-full">Entrar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>
{% endblock %}
